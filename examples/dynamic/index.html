function computeQualities(t,str,time){
    var output = "";
    var bandwidth = [];
    var profile = [];
    var linarr = [];
    var moran = [];
    var kdiff = [];
    for(let i = 0; i<t.length; i++){
        var qualities = t[i].quality();
        bandwidth.push(qualities[0]);
        profile.push(qualities[1]);
        linarr.push(qualities[2]);
        moran.push(qualities[3]);
        if(i>0){
            var p1 = t[i-1].row_perm;
            var p2 = t[i].row_perm;
            kdiff.push(minLinks(p1,p2).length);
        }
    }
    document.getElementById(str+"mean").innerHTML = "Mean<br>BW: " + d3.mean(bandwidth) + "<br>PR: " + d3.mean(profile) + "<br>LA: " + d3.mean(linarr)  + "<br>MI: " + d3.mean(moran)   + "<br>Time: " + time;
    document.getElementById(str+"min").innerHTML = "Min<br>BW: " + d3.min(bandwidth) + "<br>PR: " + d3.min(profile) + "<br>LA: " + d3.min(linarr) + "<br>MI: " + d3.min(moran);
    document.getElementById(str+"max").innerHTML = "Max<br>BW: " + d3.max(bandwidth) + "<br>PR: " + d3.max(profile) + "<br>LA: " + d3.max(linarr) + "<br>MI: " + d3.max(moran);
    document.getElementById(str+"med").innerHTML = "Median<br>BW: " + d3.median(bandwidth) + "<br>PR: " + d3.median(profile) + "<br>LA: " + d3.median(linarr) + "<br>MI: " + d3.median(moran);
    return gen_csv(moran,kdiff);
}

function gen_csv(moran,kdiff){
    var res1 = "";
    var res2 = "";
    for (var i = 0; i < kdiff.length-1; i++) {
        res1 += moran[i] + ",";
        res2 += kdiff[i] + ",";
    }
    res2 += kdiff[kdiff.length-1] + "\n";
    res1 += moran[moran.length-2] + "," + moran[moran.length-1] + "\n";
    return [res1,res2];
}

function initial_order_permute(t,str) {
      var row_perm = reorder.permutation(matrices[0].length),
          col_perm = reorder.permutation(matrices[0][0].length);
      for(let i = 0; i<t.length; i++){
        t[i].order(row_perm, col_perm);
      }
      computeQualities(t,str);
}

function random_permute(t,str) {
      var r1 = reorder.randomPermutation(matrices[0].length),
          r2 = reorder.randomPermutation(matrices[0][0].length);
      for(let i = 0; i<t.length; i++){
        t[i].order(r1,r1);
      }
      computeQualities(t,str);
}

function lo_mi_all(t,str){
    var start = new Date().getTime();
    var orders = [];
    for (var timestep = 0; timestep < t.length; timestep++) {
        var n = 0;
        var m = 0;
        for (var i = 0; i < matrices[timestep].length; i++) {
            for (var j = 0; j < matrices[timestep][0].length; j++) {
                n++;
                m += matrices[timestep][i][j];
            }
        }

      var dist = [];
        for(var i=0 ; i< matrices[timestep].length; i++){
            if(!dist[i]){
                    dist.push([]);
            }
            for(var j=0 ; j<matrices[timestep][0].length ; j++){
                if(!dist[i][j]){
                    dist[i].push(0);
                }
                var d = weighted_value_rows(matrices[timestep][i],matrices[timestep][j],n,m);
                dist[i][j] = -d;
            }
        }
      
      var order = reorder.optimal_leaf_order();
      var row_perm = order.distanceMatrix(dist)(matrices[0]);
      orders.push(row_perm);
    }
    link_transitions = [];
    orders[orders.length-1] = get_last_order(orders[orders.length-1]);
    for (var i = 0; i < t.length; i++) {
        t[i].order(orders[i], orders[i]);
        if(i > 0){
            link_transitions.push(minLinks(orders[i-1],orders[i]));
        }
    }
    var end = new Date().getTime();
    var time = end - start;
    console.log(time/1000);
    computeQualities(t,str,time);
}

function max_mi_all(t,str){
    var start = new Date().getTime();
    var orders = [];
    for (var timestep = 0; timestep < t.length; timestep++) {
        var rows = reorder.permutation(matrices[timestep].length);

        var n = 0;
        var m = 0;
        for (var i = 0; i < matrices[timestep].length; i++) {
            for (var j = 0; j < matrices[timestep][0].length; j++) {
                n++;
                if(matrices[timestep][i][j] === 1){
                    m++;
                }
            }
        }
        var all_best_morans = Number.NEGATIVE_INFINITY;
        var all_best_order = [];
        for (var init = 0; init < rows.length; init++) {
            var initial = rows[init];
            var res_timestep = [];
            res_timestep.push(initial);
            while(res_timestep.length < rows.length){
              var nearest = -1;
              for (var i = 0; i < rows.length; i++) {
                  if(!res_timestep.includes(rows[i])){
                      var last = matrices[timestep][res_timestep[res_timestep.length-1]];
                      var r1 = matrices[timestep][rows[i]];
                      var r2 = matrices[timestep][nearest];
                      if(nearest === -1){
                          nearest = rows[i];
                      }
                      else if(weighted_value_rows(last,r1,n,m) > weighted_value_rows(last,r2,n,m)){
                          nearest = rows[i];
                      }

                  }
              }

              res_timestep.push(nearest);
            }
            var best_order = res_timestep;
            var best_morans = evalOrder(timestep,best_order);
            var oldm = best_morans - 1;
            var newm = best_morans;
            while(newm-oldm > 0.0001){
                for (var i = 0; i < res_timestep.length; i++) {
                    for (var j = i+2; j < res_timestep.length-1; j++) {
                        // i and i+1 and j and j+1
                        var check = [];
                        for (var n = 0; n < res_timestep.length; n++) {
                            check[n] = res_timestep[n];
                        }
                        check[i+1] = res_timestep[j];
                        check[j] = res_timestep[i+1];
                        for (var x = 0; x < (j-(i+1)); x++) {
                             check[i+1+x] = res_timestep[j-x];
                        }
                        var oldq = weighted_value_rows(matrices[timestep][res_timestep[i]],matrices[timestep][res_timestep[i+1]],n,m) + weighted_value_rows(matrices[timestep][res_timestep[j]],matrices[timestep][res_timestep[j+1]],n,m);
                        var newq = weighted_value_rows(matrices[timestep][check[i]],matrices[timestep][check[i+1]],n,m) + weighted_value_rows(matrices[timestep][check[j]],matrices[timestep][check[j+1]],n,m);
                        if(newq > oldq){
                            res_timestep = check;
                        }
                    }
                }
                oldm = newm;
                newm = evalOrder(timestep,res_timestep);
                if(newm > best_morans){
                    best_morans = newm;
                    best_order = res_timestep;
                }
            }
            if(best_morans > all_best_morans){
                all_best_morans = best_morans;
                all_best_order = best_order;
            }
        }
        orders.push(all_best_order);
    }
    link_transitions = [];
    orders[orders.length-1] = get_last_order(orders[orders.length-1]);
    for (var i = 0; i < t.length; i++) {
        t[i].order(orders[i], orders[i]);
        if(i > 0){
            link_transitions.push(minLinks(orders[i-1],orders[i]));
        }
    }
    var end = new Date().getTime();
    var time = end - start;
    console.log(time/1000);
    computeQualities(t,str,time);
}

function max_mi_gx(t,str, timestep, do_order) {
    if(timestep === -1){
        timestep = document.getElementById("timestep").value - 1;
        if(timestep < 0 || timestep >= matrices.length){
          document.getElementById("loading").innerHTML = "Timestep (x) is not valid for this dataset";  
          return;
        }
        else{
          document.getElementById("loading").innerHTML = ""; 
        }
    }
    var start = new Date().getTime();
    
    var rows = reorder.permutation(matrices[timestep].length);

    var n = 0;
    var m = 0;
    for (var i = 0; i < matrices[timestep].length; i++) {
        for (var j = 0; j < matrices[timestep][0].length; j++) {
            n++;
            if(matrices[timestep][i][j] === 1){
                m++;
            }
        }
    }
    var all_best_morans = Number.NEGATIVE_INFINITY;
    var all_best_order = [];
    for (var init = 0; init < rows.length; init++) {
        var initial = rows[init];
        var res = [];
        res.push(initial);
        while(res.length < rows.length){
          var nearest = -1;
          for (var i = 0; i < rows.length; i++) {
              if(!res.includes(rows[i])){
                  var last = matrices[timestep][res[res.length-1]];
                  var r1 = matrices[timestep][rows[i]];
                  var r2 = matrices[timestep][nearest];
                  if(nearest === -1){
                      nearest = rows[i];
                  }
                  else if(weighted_value_rows(last,r1,n,m) > weighted_value_rows(last,r2,n,m)){
                      nearest = rows[i];
                  }
                  
              }
          }
          
          res.push(nearest);
        }
        var best_order = res;
        var best_morans = evalOrder(timestep,best_order);
        var oldm = best_morans - 1;
        var newm = best_morans;
        while(newm-oldm > 0.0001){
            for (var i = 0; i < res.length; i++) {
                for (var j = i+2; j < res.length-1; j++) {
                    // i and i+1 and j and j+1
                    var check = [];
                    for (var n = 0; n < res.length; n++) {
                        check[n] = res[n];
                    }
                    check[i+1] = res[j];
                    check[j] = res[i+1];
                    for (var x = 0; x < (j-(i+1)); x++) {
                         check[i+1+x] = res[j-x];
                    }
                    var oldq = weighted_value_rows(matrices[timestep][res[i]],matrices[timestep][res[i+1]],n,m) + weighted_value_rows(matrices[timestep][res[j]],matrices[timestep][res[j+1]],n,m);
                    var newq = weighted_value_rows(matrices[timestep][check[i]],matrices[timestep][check[i+1]],n,m) + weighted_value_rows(matrices[timestep][check[j]],matrices[timestep][check[j+1]],n,m);
                    if(newq > oldq){
                        res = check;
                    }
                }
            }
            oldm = newm;
            newm = evalOrder(timestep,res);
            if(newm > best_morans){
                best_morans = newm;
                best_order = res;
            }
        }
        if(best_morans > all_best_morans){
            all_best_morans = best_morans;
            all_best_order = best_order;
        }
    }
    var end = new Date().getTime();
    var time = end - start;
    if(do_order){
        for(let i = 0; i<t.length; i++){
            t[i].order(all_best_order, all_best_order);
          }
        computeQualities(t,str,time);
    }
    return all_best_order;
}

function weighted_value_rows(r1,r2,cells,m){
    var result = 0;
    for (var i = 0; i < r1.length; i++) {
        result += (r1[i] * cells - m) * (r2[i] * cells - m);
    }
    return result;
}

function stepwise_improvement(t,str){
    // Leaf order on the first matrix
    var transpose = reorder.transpose(matrices[0]);
    var dist_rows = reorder.dist()(matrices[0]),
    dist_cols = reorder.dist()(transpose),
    order = reorder.optimal_leaf_order(),
    row_perm = order.distanceMatrix(dist_rows)(matrices[0]),
    col_perm = order.distanceMatrix(dist_cols)(transpose);
    
    t[0].order(row_perm, row_perm);
    
    for(let timestep = 1; timestep<t.length; timestep++){
        // Compute n and m, used for distance between rows
        var n = 0;
        var m = 0;
        for (var i = 0; i < matrices[timestep].length; i++) {
            for (var j = 0; j < matrices[timestep][0].length; j++) {
                n++;
                if(matrices[timestep][i][j] === 1){
                    m++;
                }
            }
        }
        // Compute smallest similarity between adjacent rows.
        var distar = weighted_value_rows(matrices[timestep][0],matrices[timestep][matrices[timestep].length-1],n,m);
        var minimum = n * n * n;
        var min_index = -1;
        for (var i = 0; i < matrices[timestep].length-1; i++) {
            var di = weighted_value_rows(matrices[timestep][i],matrices[timestep][i+1],n,m);
            if(di < minimum){
                minimum = di;
                min_index = i;
            }
        }
        // If the smallest distance in smaller than distar, we swap blocks in row perm
        if(minimum < distar){
            var new_perm = row_perm.slice(min_index+1).concat(row_perm.slice(0,min_index+1));
            row_perm = new_perm;
            
        }
        t[timestep].order(row_perm, row_perm);
        if(minimum < distar){
            t[timestep-1].highlight_order(t[timestep],timestep===1);
        }
    } 
    
}

function minLinks(p1,p2){
    if(p1.length !== p2.length){
        return [];
    }
    var res = [];
    for (var i = 0; i < p1.length; i++) {
        var top_left = i;
        var bot_left = i;
        for (var j = 0; j < p2.length; j++) {
            if(p1[i] === p2[j]){
                var top_right = j;
                var bot_right = j;
                var inv = false;
                if(i === p1.length-1){
                    if(j !== p2.length-1){
//                        console.log(new link(i,i,j,j,false).print_link());
                        res.push(new link(i,i,j,j,false));
                    }
                    return res;
                }
                else if(j > 0 && p1[i+1] === p2[j-1]){
                    // Inverse loop
                    while(bot_left < p1.length && top_right > 0 && p1[bot_left+1] === p2[top_right-1]){
                        bot_left += 1;
                        top_right -= 1;
                    }
                    inv = true;
                }
                else if(j < p2.length-1 && p1[i+1] === p2[j+1]){
                    // Normal loop
                    while(bot_left < p1.length && bot_right < p2.length && p1[bot_left+1] === p2[bot_right+1]){
                        bot_left += 1;
                        bot_right += 1;
                    }
                }
                if(inv || top_left !== top_right){
//                    console.log(new link(top_left,bot_left,top_right,bot_right,inv).print_link());
                    res.push(new link(top_left,bot_left,top_right,bot_right,inv));
                }
            }
        }
        i = bot_left;
    
    }
    return res;
}

        if(i === t.length - 1){

    for (var i = 0; i < orders.length; i++) {
        sum += evalOrder(timestep,orders[i]);

    return sum / orders.length;
}

    return sum / path.length;
}

// Precompute and map indices!
function get_reachable_orders(initial, nr_moves){
    var orders = add_move(initial,[],nr_moves);
    var no_dups = [];
    for (var i = 0; i < orders.length; i++) {
        var occurs_twice = false;
        for (var j = i+1; j < orders.length; j++) {
            if(same_array(orders[i],orders[j])){
                occurs_twice = true;
            }
        }
        if(!occurs_twice){
            no_dups.push(orders[i]);
        }
    }
    return no_dups;
    
}

function same_array(o1,o2){
    if(o1.length !== o2.length){
        return false;
    }
    for(var i = 0 ; i < o1.length; i++){
        if(o1[i] !== o2[i]){
            return false;
        }
    }
    return true;
}

function add_move(order,links, nr_moves){
    var outcomes = [order];
    if(nr_moves === 0){
        return outcomes;
    }
    for (var i = 0; i < order.length; i++) {
        for (var x = 0; x < links.length; x++) {
            if(i >= links[x].topleft && i <= links[x].botleft){
                i = links[x.botleft];
                break;
            }
        }
        for (var j = i; j < order.length; j++) {
            for (var x = 0; x < links.length; x++) {
                if(j === links[x].topleft){
                    j = order.length;
                    break;
                }
            }
            // Add i,j as the left side of a link
            // Same principle for right side (quadruple for loop with checking the links)
            for (var k = 0; k < order.length; k++) {
                for (var x = 0; x < links.length; x++) {
                    if(k >= links[x].topright && k <= links[x].botright){
                        k = links[x.botright];
                        break;
                    }
                }
                for (var l = k; l < order.length; l++) {
                    for (var x = 0; x < links.length; x++) {
                        if(l === links[x].topleft){
                            l = order.length;
                            break;
                        }
                    }
                    if(l-k === j-i){
                        // Add, ij -> kl and ij -> lk
                        // Prevent identical outcome
                        if(i !== k){
                            for (var bool = 0; bool <= 1; bool++) {
                                var newlinks = [...links];
                                var link1 = new link(i,j,k,l,false);
                                newlinks.push(link1);
                                var neworder1 = do_move_link(order,link1, bool);
                                outcomes = outcomes.concat(add_move(neworder1,newlinks,nr_moves-1));
                                if(!bool || i !== j){ // No need to invert single swaps
                                    var newlinks1 = [...links];
                                    newlinks1.push(link1);
                                    neworder1 = do_swap_link(order,link1,bool);
                                    outcomes = outcomes.concat(add_move(neworder1,newlinks1,nr_moves-1));
                                }
                            }
                        } // No need to invert singles
                        else if(i !== j){
                            for (var bool = 0; bool <= 1; bool++) {
                                var newlinksInv = [...links];
                                var link2 = new link(i,j,k,l,true);
                                newlinksInv.push(link2);
                                var neworder2 = do_move_link(order,link2,bool);
                                outcomes = outcomes.concat(add_move(neworder2,newlinksInv,nr_moves-1));
                                var newlinksInv1 = [...links];
                                newlinksInv1.push(link2);
                                var neworder2 = do_swap_link(order,link2,bool);
                                outcomes = outcomes.concat(add_move(neworder2,newlinksInv1,nr_moves-1));
                            }
                        }
                    }
                    
                }
            }
            // Print the ouput, save it for precomputing purposes...
        }
    }
    return outcomes;
}

function do_move_link(order,l,inv){
    var neworder = [...order];
    // Move the Link part
    var b;
    if(l.inversed){
        b = l.botright;
    }
    else{
        b = l.topright;
    }
    for(var a = l.topleft; a <= l.botleft; a++){
        neworder[b] = order[a];
        if(l.inversed){
            b--;
        }
        else{
            b++;
        }
    }
    // Move the rest
    // Link is going down
    if(l.topleft < l.topright){
        if(!inv){
            var b = l.topleft;
            for(var a = l.botleft+1; a <= l.botright; a++){
                neworder[b] = order[a];
                b++;
            }
        }
        else{
            var b = l.topright-1;
            for(var a = l.botleft+1; a <= l.botright; a++){
                neworder[b] = order[a];
                b--;
            }
        }
    }
    // Link is going up 
    else{
        if(!inv){
            var b = l.botright+1;
            for(var a = l.topright; a < l.topleft; a++){
                neworder[b] = order[a];
                b++;
            }
        }
        else{
            var b = l.botleft;
            for(var a = l.topright; a < l.topleft; a++){
                neworder[b] = order[a];
                b--;
            }
        }
    }
    if(hasDuplicates(neworder)){
        debugger;
    }
    return neworder;
}

function hasDuplicates(array) {
    return (new Set(array)).size !== array.length;
}

function do_swap_link(order,l, inv){
    // BUG
    // Going up
    if(l.topleft >= l.topright && l.topleft <= l.botright){
        return do_move_link(order,l,inv);
    }
    // Going down
    if(l.topleft <= l.topright && l.botleft >= l.topright){
        return do_move_link(order,l,inv);
    }
    var neworder = [...order];
    // Move the Link part
    var b;
    if(l.inversed){
        b = l.botright;
    }
    else{
        b = l.topright;
    }
    for(var a = l.topleft; a <= l.botleft; a++){
        neworder[b] = order[a];
        if(l.inversed){
            b--;
        }
        else{
            b++;
        }
    }
    // Move the rest
    if(!inv){
        var a = l.topright;
        for (var b = l.topleft; b <= l.botleft; b++) {
            neworder[b] = order[a];
            a++;
        }
    }
    else{
        var a = l.topright;
        for (var b = l.botleft; b >= l.topleft; b--) {
            neworder[b] = order[a];
            a++;
        }
    }
    if(hasDuplicates(neworder)){
        debugger;
    }
    return neworder;
}

function near_simultaneous_dag(t,str){
    var start = new Date().getTime();
    // Create DAG / adjacency list
    var simul_order = simultaneous_morans_leaf_order_permute(t,str,false);
    var reachable = get_reachable_orders(simul_order,1);
    var adjacencylist = [];
    for (var i = 0; i < reachable.length; i++) {
        var fromi = [];
        if(i%1000 === 0){
            console.log(i + " of " + reachable.length);
        }
        for (var j = 0; j < reachable.length; j++) {
            if(minLinks(reachable[i],reachable[j]).length <= 2){
                fromi.push(j);
            }
        }
        adjacencylist.push(fromi);
    }
    // O(V+E) computes MIs per timestep and the best paths to them
    // Keep one path per vertex: the best one,
    // a path is valued on the total of MIs
    var all_refs = [];
    var nodevalues = [];
    var fill = [];
    for (var i = 0; i < reachable.length; i++) {
        nodevalues.push(evalOrder(0,reachable[i]));
        fill.push(0);
    }
    // Push a useless array so that the indices match up
    all_refs.push(fill);
    for (var i = 1; i < t.length; i++) {
        console.log("Timestep " + i);
        var irefs = [];
        var try_values = [];
        for (var j = 0; j < reachable.length; j++) {
            try_values.push(Number.NEGATIVE_INFINITY);
            irefs.push(0);
        }
        for (var j = 0; j < adjacencylist.length; j++) {
            var neighbors = adjacencylist[j];
            for (var k = 0; k < neighbors.length; k++) {
                var reach = neighbors[k];
                var value = nodevalues[j] + evalOrder(i,reachable[reach]);
                if(value > try_values[reach]){
                    try_values[reach] = value;
                    irefs[reach] = j;
                }
                
            }
        }
        nodevalues = try_values;
        all_refs.push(irefs);
    }
    var best = 0;
    for (var i = 0; i < nodevalues.length; i++) {
        if(nodevalues[best] < nodevalues[i]){
            best = i;
        }
    }
    var orders = [];
    for (var i = 0; i < t.length; i++) {
        orders.push([]);
    }
    var lastindex = best;
    orders[t.length-1] = reachable[lastindex];
    for (var i = t.length-2; i >= 0; i--) {
        var index = all_refs[i+1][lastindex];
        orders[i] = reachable[index];
        lastindex = index;
    }
    var end = new Date().getTime();
    var time = end - start;
    console.log(time/1000);
    link_transitions = [];
    for(let i = 0; i<t.length; i++){
        t[i].order(orders[i], orders[i]);
        if(i > 0){
            link_transitions.push(minLinks(orders[i-1],orders[i]));
        }
    }
    return computeQualities(t,str,-1);
    
}

            var reachable = map_reachable(res[res.length-1],id_reachable);
            for (var j = 0; j < reachable.length; j++) {
                if(can_interpolate_to(reachable[j],res_inv[res_inv.length-1],(t.length-1)-i)){
                    var score = evalOrder(Math.floor(i/2),reachable[j]);
                    if(score > best_value){
                        best_value = score;
                        best_index = j;
                    }
                }
            }
            res.push(reachable[best_index]);
        }
        else{
            var best_value = Number.NEGATIVE_INFINITY;
            var best_index = 0;
            var reachable = map_reachable(res_inv[res_inv.length-1],id_reachable);
            for (var j = 0; j < reachable.length; j++) {
                if(can_interpolate_to(reachable[j],res[res.length-1],(t.length-1)-i)){
                    var score = evalOrder((t.length-1)-Math.floor(i/2),reachable[j]);
                    if(score > best_value){
                        best_value = score;
                        best_index = j;
                    }
                }
            }
            res_inv.push(reachable[best_index]);
        }
    }
    for (var i = res_inv.length-1; i >= 0; i--) {
        res.push(res_inv[i]);
    }
//    console.log(res);
    var endtime = new Date().getTime();
    var time = endtime - starttime;
    console.log(time/1000);
    link_transitions = [];
    for (var i = 0; i < t.length; i++) {
        t[i].order(res[i], res[i]);
        if(i > 0){
            link_transitions.push(minLinks(res[i-1],res[i]));
        }
    }
    return computeQualities(t,str,-1);
    
}


function nr_changes(a,b){
    var changes = 0;
    for (var i = 0; i < a.length; i++) {
        if(a[i] !== b[i]){
            changes += 1;
        }
    }
    return changes;
}

function can_interpolate_to(a,b,batches){
//    return batches >= nr_changes(a,b);
    var m = minLinks(a,b).length;
    return batches >= (m + count_gaps(a,b))-1;
}

function count_gaps(a,b){
    var ingap = a[0] === b[0];
    var gaps = 0;
    for (var i = 1; i < a.length; i++) {
        if(!ingap && a[i] === b[i]){
            gaps += 1;
            ingap = true;
        }
        if(ingap && a[i] !== b[i])
            ingap = false;
    }
    if(a[a.length-1] === b[b.length-1]){
        gaps = gaps - 1;
    }
    return gaps;
}

function all_equal(a,b,c,d){
    return a === b && a === c && a === d && b === c && b === d && c === d;
}

function precompute(){
    precomputedMI = [];
    for (var i = 0; i < matrices.length; i++) {
        // Compute n and m
        var matrix = [];
        
        var n = 0;
        var m = 0;
        for (var x = 0; x < matrices[i].length; x++) {
            for (var y = 0; y < matrices[i][0].length; y++) {
                n++;
                if(matrices[i][x][y] === 1){
                    m++;
                }
            }
        }
        
        for (var j = 0; j < matrices[i].length; j++) {
            var rowj = [];
            for (var k = 0; k < matrices[i].length; k++) {
                // Add mi gain to matrix;
                rowj.push(weighted_value_rows(matrices[i][j],matrices[i][k],n,m));
            }
            matrix.push(rowj);
        }
        precomputedMI.push(matrix);
    }
}

function evalOrder(timestep,order){
    var sum = 0;
    for (var i = 0; i < order.length-1; i++) {
        var val = precomputedMI[timestep][order[i]][order[i+1]];
        sum += val;
    }
    return sum;
}

function get_MI(ti,order){
    var permuted = [];
    for (var a = 0; a < ti.row_perm.length; a++) {
        permuted.push([]);
        for (var b = 0; b < ti.col_perm.length; b++) {
            permuted[a].push(ti.matrix[order[a]][order[b]]);
        }
    }
    var mi = ti.computeMorans(permuted)[0];
    return mi;
}

function greedy_drifting_order(init,n,drift_speed){

function random_integer(min, max) {

    min = min - 0.5;
    return Math.round(Math.random() * (max - min) + min);
