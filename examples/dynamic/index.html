function computeQualities(t,str,time){
    var output = "";
    var bandwidth = [];
    var profile = [];
    var linarr = [];
    var moran = [];
    for(let i = 0; i<t.length; i++){
        var qualities = t[i].quality();
        bandwidth.push(qualities[0]);
        profile.push(qualities[1]);
        linarr.push(qualities[2]);
        moran.push(qualities[3]);
    }
    document.getElementById(str+"mean").innerHTML = "Mean<br>BW: " + d3.mean(bandwidth) + "<br>PR: " + d3.mean(profile) + "<br>LA: " + d3.mean(linarr)  + "<br>MI: " + d3.mean(moran)   + "<br>Time: " + time;
    document.getElementById(str+"min").innerHTML = "Min<br>BW: " + d3.min(bandwidth) + "<br>PR: " + d3.min(profile) + "<br>LA: " + d3.min(linarr) + "<br>MI: " + d3.min(moran);
    document.getElementById(str+"max").innerHTML = "Max<br>BW: " + d3.max(bandwidth) + "<br>PR: " + d3.max(profile) + "<br>LA: " + d3.max(linarr) + "<br>MI: " + d3.max(moran);
    document.getElementById(str+"med").innerHTML = "Median<br>BW: " + d3.median(bandwidth) + "<br>PR: " + d3.median(profile) + "<br>LA: " + d3.median(linarr) + "<br>MI: " + d3.median(moran);
}

function max_mi_gx(t,str) {
    var timestep = document.getElementById("timestep").value - 1;
      if(timestep < 0 || timestep >= matrices.length){
        document.getElementById("loading").innerHTML = "Timestep (x) is not valid for this dataset";  
        return;
      }
      else{
        document.getElementById("loading").innerHTML = ""; 
      }
    var start = new Date().getTime();
    
    var rows = reorder.permutation(matrices[timestep].length);

    var n = 0;
    var m = 0;
    for (var i = 0; i < matrices[timestep].length; i++) {
        for (var j = 0; j < matrices[timestep][0].length; j++) {
            n++;
            if(matrices[timestep][i][j] === 1){
                m++;
            }
        }
    }
    var best_morans = -1;
    var best_order = [];
    for (var i = 0; i < rows.length; i++) {
        var initial = rows[0];
        var res = [];
        res.push(initial);
        while(res.length < rows.length){
          var nearest = -1;
          for (var i = 1; i < rows.length; i++) {
              if(!res.includes(rows[i])){
                  var last = matrices[timestep][res[res.length-1]];
                  var r1 = matrices[timestep][rows[i]];
                  var r2 = matrices[timestep][nearest];
                  if(nearest === -1){
                      nearest = rows[i];
                  }
                  else if(weighted_value_rows(last,r1,n,m) > weighted_value_rows(last,r2,n,m)){
                      nearest = rows[i];
                  }
                  else{
                  }
              }
          }
          res.push(nearest);
        }
        for(let i = 0; i<t.length; i++){
          t[i].order(res, res);
        }
        best_order = res;
        var oldm = 0;
        var newm = t[0].quality()[3];
        while(newm-oldm > 0.0001){
            for (var i = 0; i < res.length; i++) {
                for (var j = i+2; j < res.length-1; j++) {
                    // i and i+1 and j and j+1
                    var check = [];
                    for (var n = 0; n < res.length; n++) {
                        check[n] = res[n];
                    }
                    check[i+1] = res[j];
                    check[j] = res[i+1];
                    for (var x = 0; x < (j-(i+1)); x++) {
                         check[i+1+x] = res[j-x];
                    }
                    var oldq = weighted_value_rows(matrices[timestep][res[i]],matrices[timestep][res[i+1]],n,m) + weighted_value_rows(matrices[timestep][res[j]],matrices[timestep][res[j+1]],n,m);
                    var newq = weighted_value_rows(matrices[timestep][check[i]],matrices[timestep][check[i+1]],n,m) + weighted_value_rows(matrices[timestep][check[j]],matrices[timestep][check[j+1]],n,m);
                    if(newq > oldq){
                        res = check;
                    }
                }
            }
            for(let i = 0; i<t.length; i++){
                t[i].order(res, res);
              }
            oldm = newm;
            newm = t[0].quality()[3];
            if(newm > best_morans){
                best_morans = newm;
                best_order = res;
            }
        }
    }
    var end = new Date().getTime();
    var time = end - start;
    for(let i = 0; i<t.length; i++){
        t[i].order(best_order, best_order);
      }
    computeQualities(t,str,time);
}

function weighted_value_rows(r1,r2,cells,m){
    var result = 0;
    for (var i = 0; i < r1.length; i++) {
        result += (r1[i] * cells - m) * (r2[i] * cells - m);
    }
    return result;
}

function union_l2_leaf_order_permute(t,str,square) {
  // L2
  var start = new Date().getTime();
  var pile = [];
  for(var i=0 ; i< matrices[0].length; i++){
      if(!pile[i]){
              pile.push([]);
      }
      for(var j=0 ; j<matrices[0][0].length ; j++){
          if(!pile[i][j]){
              pile[i].push(0);
          }
          for(var k = 0; k<matrices.length; k++){
              pile[i][j] = pile[i][j] + matrices[k][i][j];
          }
      }
  }

  var transpose = reorder.transpose(pile),
      dist_rows = reorder.dist()(pile,square),
      dist_cols = reorder.dist()(transpose);
      var
      order = reorder.optimal_leaf_order();
      var row_perm = order.distanceMatrix(dist_rows)(matrices[0]);
//      col_perm = order.distanceMatrix(dist_cols)(transpose);
      
      var end = new Date().getTime();
    var time = end - start;
    for(let i = 0; i<t.length; i++){
        t[i].order(row_perm, row_perm);
      }
      return computeQualities(t,str,time);
      
}

function union_morans_leaf_order_permute(t,str,square){
    // Morans Distance
    var start = new Date().getTime();
  var pile = [];
  for(var i=0 ; i< matrices[0].length; i++){
      if(!pile[i]){
              pile.push([]);
      }
      for(var j=0 ; j<matrices[0][0].length ; j++){
          if(!pile[i][j]){
              pile[i].push(0);
          }
          for(var k = 0; k<matrices.length; k++){
              pile[i][j] = pile[i][j] + matrices[k][i][j];
          }
      }
  }

  var n = 0;
    var m = 0;
    for (var i = 0; i < pile.length; i++) {
        for (var j = 0; j < pile[0].length; j++) {
            n++;
            m += pile[i][j];
        }
    }

  var dist = [];
    for(var i=0 ; i< pile.length; i++){
        if(!dist[i]){
                dist.push([]);
        }
        for(var j=0 ; j<pile[0].length ; j++){
            if(!dist[i][j]){
                dist[i].push(0);
            }
            var d = weighted_value_rows(pile[i],pile[j],n,m);
                if(square){
                    if(d >= 0){
                        dist[i][j] = -d * d;
                    }
                    else{
                        dist[i][j] = d * d;
                    }
                }
                else{
                    dist[i][j] = -d;
                }
        }
    }
    var order = reorder.optimal_leaf_order();
    var row_perm = order.distanceMatrix(dist)(matrices[0]);
//      col_perm = order.distanceMatrix(dist_cols)(transpose);
      
      var end = new Date().getTime();
    var time = end - start;
    for(let i = 0; i<t.length; i++){
        t[i].order(row_perm, row_perm);
      }
      return computeQualities(t,str,time);
}

function simultaneous_l2_leaf_order_permute(t,str,square) {
    var matrices = t.map(x => x.matrix);
    var start = new Date().getTime();
    var transposed = [];
    for(let i = 0; i<matrices.length; i++){
      transposed[i] = reorder.transpose(matrices[i]);
    }
    var dist_rows = reorder.dist()(matrices,square);
    var
    order = reorder.optimal_leaf_order();
    var row_perm = order.distanceMatrix(dist_rows)(matrices[0]);
    
    var end = new Date().getTime();
    var time = end - start;
    for(let i = 0; i<t.length; i++){
      t[i].order(row_perm, row_perm);
    }
    computeQualities(t,str,time);
    return row_perm;
}

function simultaneous_morans_leaf_order_permute(t,str,square) {
    var start = new Date().getTime();
    var transposed = [];
    for(let i = 0; i<matrices.length; i++){
      transposed[i] = reorder.transpose(matrices[i]);
    }
    var dist = [];
    for (var k = 0; k < matrices.length; k++) {
        
        var n = 0;
        var m = 0;
        for (var i = 0; i < matrices[k].length; i++) {
            for (var j = 0; j < matrices[k][0].length; j++) {
                n++;
                m += matrices[k][i][j];
            }
        }
        
        
        for(var i=0 ; i< matrices[k].length; i++){
            if(!dist[i]){
                    dist.push([]);
            }
            for(var j=0 ; j<matrices[k][0].length ; j++){
                if(!dist[i][j]){
                    dist[i].push(0);
                }   
                    var d = weighted_value_rows(matrices[k][i],matrices[k][j],n,m);
                    if(square){
                        if(d >= 0){
                            dist[i][j] += -d * d;
                        }
                        else{
                            dist[i][j] += d * d;
                        }
                    }
                    else{
                        dist[i][j] += -d;
                    }
            }
        }
    }
        
    var order = reorder.optimal_leaf_order();
    var row_perm = order.distanceMatrix(dist)(matrices[0]);
//      col_perm = order.distanceMatrix(dist_cols)(transposed[0]);
    
    var end = new Date().getTime();
    var time = end - start;
    for(let i = 0; i<t.length; i++){
      t[i].order(row_perm, row_perm);
    }
    computeQualities(t,str,time);
    return row_perm;
}

function gx_barycenter_permute(t,str) {
        var timestep = document.getElementById("timestep").value - 1;
        if(timestep < 0 || timestep >= matrices.length){
          document.getElementById("loading").innerHTML = "Timestep (x) is not valid for this dataset";  
          return;
        }
        else{
          document.getElementById("loading").innerHTML = ""; 
        }
        var nodes = [];
        var links = [];
        for(let i = 0; i < matrices[timestep].length; i++){
            nodes[i] = {"name": col_labels[i], "group" : 1};
        }
        
        for(let i = 0; i < matrices[timestep].length; i++){
            for(var j=0; j<matrices[timestep][0].length; j++){
                if(matrices[timestep][i][j] === 1){
                    links.push({"source" : i, "target" : j, "value" : 1});
                }
                
            }
        }
        
        var graph = reorder.graph()
	  .nodes(nodes)
	  .links(links)
	  .init();
        order = reorder.barycenter_order(graph);
        improved = reorder.adjacent_exchange(graph,
						 order[0],
						 order[1]);
        var row_perm = improved[0],
            col_perm = improved[1];

      for(let i = 0; i<t.length; i++){
        t[i].order(row_perm, col_perm);
      }
      computeQualities(t,str);
}

function union_barycenter_permute(t,str) {
    var start = new Date().getTime();
    var pile = [];
    for(var i=0 ; i< matrices[0].length; i++){
        if(!pile[i]){
          pile.push([]);
        }
        for(var j=0 ; j<matrices[0][0].length ; j++){
            if(!pile[i][j]){
                pile[i].push(0);
            }
            for(var k = 0; k<matrices.length; k++){
                pile[i][j] = pile[i][j] + matrices[k][i][j];
            }
        }
    }

    var nodes = [];
    var links = [];
    for(let i = 0; i < matrices[0].length; i++){
        nodes[i] = {"name": col_labels[i], "group" : 1};
    }

    for(let i = 0; i < matrices[0].length; i++){
        for(var j=0; j<matrices[0][0].length; j++){
            if(pile[i][j] !== 0){
                links.push({"source" : i, "target" : j, "value" : pile[i][j]});
            }

        }
    }

    var graph = reorder.graph()
      .nodes(nodes)
      .links(links)
      .init();

    order = reorder.barycenter_order(graph);
    improved = reorder.adjacent_exchange(graph,
                                             order[0],
                                             order[1]);
    var row_perm = improved[0],
        col_perm = improved[1];

    var end = new Date().getTime();
    var time = end - start;
    for(let i = 0; i<t.length; i++){
      t[i].order(row_perm, col_perm);
    }
    return computeQualities(t,str,time);
}

function simultaneous_barycenter_permute(t,str) {
    var start = new Date().getTime();
        
        var graphs = [];
        for(let k = 0; k<matrices.length; k++){
            var nodes = [];
            var links = [];
            for(let i = 0; i < matrices[0].length; i++){
                nodes[i] = {"name": col_labels[i], "group" : 1};
            }

            for(let i = 0; i < matrices[0].length; i++){
                for(var j=0; j<matrices[0][0].length; j++){
                    if(matrices[k][i][j] === 1){
                        links.push({"source" : i, "target" : j, "value" : 1});
                    }

                }
            }

            var graph = reorder.graph()
              .nodes(nodes)
              .links(links)
              .init();
            graphs[k] = graph;
        }
        var order = reorder.barycenter_order(graphs);
        var improved = reorder.adjacent_exchange(graphs,
						 order[0],
						 order[1]);
        var row_perm = improved[0],
            col_perm = improved[1];
      
    var end = new Date().getTime();
    var time = end - start;
    for(let i = 0; i<tables.length; i++){
        t[i].order(row_perm, col_perm);
      }
    return computeQualities(t,str,time);
}

// Not really stable
function stable_split_LO(t, str){
    var halfway = Math.round(t.length/2);
    var t_copy = [].concat(t);
    const first_half = t_copy.splice(0,halfway);
    const second_half = t_copy;
    simultaneous_l2_leaf_order_permute(first_half,str,false);
    simultaneous_l2_leaf_order_permute(second_half,str,false);
    first_half[halfway-1].highlight_order(second_half[0]);
}

function stepwise_improvement(t,str){
    // Leaf order on the first matrix
    var transpose = reorder.transpose(matrices[0]);
    var dist_rows = reorder.dist()(matrices[0]),
    dist_cols = reorder.dist()(transpose),
    order = reorder.optimal_leaf_order(),
    row_perm = order.distanceMatrix(dist_rows)(matrices[0]),
    col_perm = order.distanceMatrix(dist_cols)(transpose);
    
    t[0].order(row_perm, row_perm);
    
    for(let timestep = 1; timestep<t.length; timestep++){
        // Compute n and m, used for distance between rows
        var n = 0;
        var m = 0;
        for (var i = 0; i < matrices[timestep].length; i++) {
            for (var j = 0; j < matrices[timestep][0].length; j++) {
                n++;
                if(matrices[timestep][i][j] === 1){
                    m++;
                }
            }
        }
        // Compute smallest similarity between adjacent rows.
        var distar = weighted_value_rows(matrices[timestep][0],matrices[timestep][matrices[timestep].length-1],n,m);
        var minimum = n * n * n;
        var min_index = -1;
        for (var i = 0; i < matrices[timestep].length-1; i++) {
            var di = weighted_value_rows(matrices[timestep][i],matrices[timestep][i+1],n,m);
            if(di < minimum){
                minimum = di;
                min_index = i;
            }
        }
        // If the smallest distance in smaller than distar, we swap blocks in row perm
        if(minimum < distar){
            var new_perm = row_perm.slice(min_index+1).concat(row_perm.slice(0,min_index+1));
            row_perm = new_perm;
            
        }
        t[timestep].order(row_perm, row_perm);
        if(minimum < distar){
            t[timestep-1].highlight_order(t[timestep],timestep===1);
        }
    } 
    
}

function minLinks(p1,p2){
    if(p1.length !== p2.length){
        return [];
    }
    var res = [];
    for (var i = 0; i < p1.length; i++) {
        var top_left = i;
        var bot_left = i;
        for (var j = 0; j < p2.length; j++) {
            if(p1[i] === p2[j]){
                var top_right = j;
                var bot_right = j;
                var inv = false;
                if(i === p1.length-1){
                    if(j !== p2.length-1){
//                        console.log(new link(i,i,j,j,false).print_link());
                        res.push(new link(i,i,j,j,false));
                    }
                    return res;
                }
                else if(j > 0 && p1[i+1] === p2[j-1]){
                    // Inverse loop
                    while(bot_left < p1.length && top_right > 0 && p1[bot_left+1] === p2[top_right-1]){
                        bot_left += 1;
                        top_right -= 1;
                    }
                    inv = true;
                }
                else if(j < p2.length-1 && p1[i+1] === p2[j+1]){
                    // Normal loop
                    while(bot_left < p1.length && bot_right < p2.length && p1[bot_left+1] === p2[bot_right+1]){
                        bot_left += 1;
                        bot_right += 1;
                    }
                }
                if(inv || top_left !== top_right){
//                    console.log(new link(top_left,bot_left,top_right,bot_right,inv).print_link());
                    res.push(new link(top_left,bot_left,top_right,bot_right,inv));
                }
            }
        }
        i = bot_left;
    
    }
    return res;
}

function averageMI(ti, orders){
    var sum = 0;
    for (var i = 0; i < orders.length; i++) {
        sum += ti.computeMorans(orders[i])[0];
    }
    return sum / orders.length;
}

function possibly_add(ti,new_orders,order){
    if(new_orders.length < 10){
        new_orders.push(order);
        return new_orders;
    }
    var candidate = -1;
    // Check how many are similar
    for (var i = 0; i < new_orders; i++) {
        if(difference(order,new_orders[i]) <= 2){
            // Two are similar, it can never be added
            if(candidate >= 0){
                return new_orders;
            }
            candidate = i;
        }
    }
    // One is similar
    if(candidate >= 0){
        if(ti.computeMorans(order)[0] > ti.computeMorans(new_orders[candidate])){
            new_orders[candidate] = order;
        }
        return new_orders;
    }
    // None is similar, get the best one
    candidate = 0;
    for (var i = 1; i < new_orders.length; i++) {
        if(ti.computeMorans(new_orders[i])[0] < ti.computeMorans(new_orders[candidate])[0]){
            candidate = i;
        }
    }
    new_orders[candidate] = order;
    return new_orders;
    
    
}

}

// Precompute and map indices!
function get_reachable_orders(initial, nr_moves){
    var orders = add_move(initial,[],nr_moves);
    var no_dups = [];
    for (var i = 0; i < orders.length; i++) {
        var occurs_twice = false;
        for (var j = i+1; j < orders.length; j++) {
            if(same_array(orders[i],orders[j])){
                occurs_twice = true;
            }
        }
        if(!occurs_twice){
            no_dups.push(orders[i]);
        }
    }
    return no_dups;
    
}

function same_array(o1,o2){
    if(o1.length !== o2.length){
        return false;
    }
    for(var i = 0 ; i < o1.length; i++){
        if(o1[i] !== o2[i]){
            return false;
        }
    }
    return true;
}

function add_move(order,links, nr_moves){
    var outcomes = [order];
    if(nr_moves === 0){
        return outcomes;
    }
    for (var i = 0; i < order.length; i++) {
        for (var x = 0; x < links.length; x++) {
            if(i >= links[x].topleft && i <= links[x].botleft){
                i = links[x.botleft];
                break;
            }
        }
        for (var j = i; j < order.length; j++) {
            for (var x = 0; x < links.length; x++) {
                if(j === links[x].topleft){
                    j = order.length;
                    break;
                }
            }
            // Add i,j as the left side of a link
            // Same principle for right side (quadruple for loop with checking the links)
            for (var k = 0; k < order.length; k++) {
                for (var x = 0; x < links.length; x++) {
                    if(k >= links[x].topright && k <= links[x].botright){
                        k = links[x.botright];
                        break;
                    }
                }
                for (var l = k; l < order.length; l++) {
                    for (var x = 0; x < links.length; x++) {
                        if(l === links[x].topleft){
                            l = order.length;
                            break;
                        }
                    }
                    if(l-k === j-i){
                        // Add, ij -> kl and ij -> lk
                        // Prevent identical outcome
                        if(i !== k){
                            var newlinks = [...links];
                            var link1 = new link(i,j,k,l,false);
                            newlinks.push(link1);
                            // Do swap for passing
                            var neworder1 = doLink(order,link1);
//                            console.log("Swap " + i + j + k + l);
//                            console.log(neworder1);
                            outcomes = outcomes.concat(add_move(neworder1,newlinks,nr_moves-1));
                        }
                        else if(!all_equal(i,j,k,l)){
                            var newlinksInv = [...links];
                            var link2 = new link(i,j,k,l,true);
                            newlinksInv.push(link2);
                            var neworder2 = doLink(order,link2);
//                            console.log("SwapInv " + i + j + k + l);
//                            console.log(neworder2);
                            outcomes = outcomes.concat(add_move(neworder2,newlinksInv,nr_moves-1));
                        }
                    }
                    
                }
            }
            // Print the ouput, save it for precomputing purposes...
        }
    }
    return outcomes;
}

function doLink(order,l){
    var neworder = [...order];
    // Move the Link part
    var b;
    if(l.inversed){
        b = l.botright;
    }
    else{
        b = l.topright;
    }
    for(var a = l.topleft; a <= l.botleft; a++){
        neworder[b] = order[a];
        if(l.inversed){
            b--;
        }
        else{
            b++;
        }
    }
    // Move the rest
    // Link is going down
    if(l.topleft < l.topright){
        var b = l.topleft;
        for(var a = l.botleft+1; a <= l.botright; a++){
            neworder[b] = order[a];
            b++;
        }
    }
    // Link is going up
    else{
        var b = l.botright+1;
        for(var a = l.topright; a < l.topleft; a++){
            neworder[b] = order[a];
            b++;
        }
    }
    return neworder;
}

function all_equal(a,b,c,d){
    return a === b && a === c && a === d && b === c && b === d && c === d;
}
