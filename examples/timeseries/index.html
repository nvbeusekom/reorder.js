// This function is supposed to be called from data files
function load_data(matrices_data){
    const labels = [];
    for (let i = 0; i < matrices_data[0].length; i++) {
        labels.push(i);
    }
    const col_labels_data = labels;
    const row_labels_data = labels;
    const tables_data = [];
    let linksets_data = [];
    const svg = d3.select("#heatmap").append("svg")
                .attr("width", matrices_data.length * (width + margin.left + margin.right))
                .attr("height", height + margin.top + margin.bottom);
    for(let i = 0; i<matrices_data.length; i++){
        let offset = margin.left + i * (margin.right + width + margin.left);
        let group = svg
            .append("g")
            .attr("transform", "translate(" + offset + "," + margin.top + ")");
        const t1 = new table({matrix: matrices_data[i], row_labels_data: labels, col_labels_data: labels},group);
        tables_data[i] = t1;
        if(i < matrices_data.length-1){
            let linkoffset = offset + width;
            let linkgroup = svg
                .append("g")
                .attr("transform", "translate(" + linkoffset + "," + margin.top + ")");
            const ls = new linkset([],matrices_data[i].length,linkgroup);
            linksets_data[i] = ls;
        }
    }
    return [matrices_data,col_labels_data,row_labels_data, tables_data,linksets_data];
}

function computeQualities(t,str,time){
    var output = "";
    var bandwidth = [];
    var profile = [];
    var linarr = [];
    var moran = [];
    var kdiff = [];
    for(let i = 0; i<t.length; i++){
        var qualities = t[i].quality();
        bandwidth.push(qualities[0]);
        profile.push(qualities[1]);
        linarr.push(qualities[2]);
        moran.push(qualities[3]);
        if(i>0){
            var p1 = t[i-1].row_perm;
            var p2 = t[i].row_perm;
            kdiff.push(minLinks(p1,p2).length);
        }
    }
    document.getElementById(str+"mean").innerHTML = "Mean<br>BW: " + d3.mean(bandwidth) + "<br>PR: " + d3.mean(profile) + "<br>LA: " + d3.mean(linarr)  + "<br>MI: " + d3.mean(moran)   + "<br>Time: " + time;
    document.getElementById(str+"min").innerHTML = "Min<br>BW: " + d3.min(bandwidth) + "<br>PR: " + d3.min(profile) + "<br>LA: " + d3.min(linarr) + "<br>MI: " + d3.min(moran);
    document.getElementById(str+"max").innerHTML = "Max<br>BW: " + d3.max(bandwidth) + "<br>PR: " + d3.max(profile) + "<br>LA: " + d3.max(linarr) + "<br>MI: " + d3.max(moran);
    document.getElementById(str+"med").innerHTML = "Median<br>BW: " + d3.median(bandwidth) + "<br>PR: " + d3.median(profile) + "<br>LA: " + d3.median(linarr) + "<br>MI: " + d3.median(moran);
    return [moran,kdiff,time];
}

function gen_csv(moran,kdiff){
    var res1 = "";
    var res2 = "";
    for (var i = 0; i < kdiff.length-1; i++) {
        res1 += moran[i] + ",";
        res2 += kdiff[i] + ",";
    }
    res2 += kdiff[kdiff.length-1] + "\n";
    res1 += moran[moran.length-2] + "," + moran[moran.length-1] + "\n";
    return [res1,res2];
}
